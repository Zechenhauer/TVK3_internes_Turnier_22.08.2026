<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internes Turnier TV Kapellen 3</title>
    <style>
        :root { 
            --bg: #1e1e2e; 
            --card: #2b2b3d; 
            --accent: #e6a100; /* Gold/Bernstein */
            --text: #ffffff; 
            --sub: #a0a0b0; 
            --win-bg: #1b4d2e;
            --win-text: #2ecc71;
            --loss-bg: #4d1b1b;
            --loss-text: #e74c3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; } 
        
        .header-container { text-align: center; margin-bottom: 20px; }

        /* Header Title Container mit Logos links & rechts */
        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 4px;
        }

        .header-logo {
            height: 48px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        h1 { color: var(--accent); margin: 0; }
        .date-sub { color: var(--sub); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.5px; }

        h2, h3 { text-align: center; color: var(--accent); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 8px; margin: 4px 0 12px 0; border-radius: 6px; border: 1px solid #444; background: #181825; color: var(--accent); font-weight: bold; box-sizing: border-box; }
        .btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #3d3d52; color: #fff; margin-top: 0; }
        .btn-danger { background: #e74c3c; color: #fff; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #3d3d52; }
        th { color: var(--sub); font-size: 0.9em; }
        
        .table-player-tag {
            background-color: rgba(230, 161, 0, 0.12);
            color: var(--text);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
            display: inline-block;
            border: 1px solid rgba(230, 161, 0, 0.25);
        }

        .match-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: #181825; padding: 8px 12px; border-radius: 6px; }
        .match-row .player { font-size: 0.95em; width: 40%; font-weight: bold; color: var(--accent); padding: 4px 8px; border-radius: 4px; transition: all 0.2s ease; }
        .match-row .player.right { text-align: right; }
        .match-row input { width: 45px; text-align: center; padding: 5px; margin: 0 5px; border-radius: 4px; border: 1px solid #444; background: #2b2b3d; color: #fff; font-weight: bold; }
        
        .match-row .player.winner { background-color: var(--win-bg) !important; color: var(--win-text) !important; }
        .match-row .player.loser { background-color: var(--loss-bg) !important; color: var(--loss-text) !important; }

        .hidden { display: none; }
        .ko-section { max-width: 800px; margin: 0 auto; }
        .placeholder { color: var(--sub); font-style: italic; font-weight: normal !important; }

        @media (max-width: 600px) {
            .title-row { gap: 8px; }
            .header-logo { height: 35px; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-row">
            <img src="https://lh3.googleusercontent.com/d/1PB4X2QrrMlaRlajQEWDtJxRP2c6VTsI5" alt="TV Kapellen Logo" class="header-logo">
            <h1>Internes Turnier TV Kapellen 3</h1>
            <img src="https://lh3.googleusercontent.com/d/1PB4X2QrrMlaRlajQEWDtJxRP2c6VTsI5" alt="TV Kapellen Logo" class="header-logo">
        </div>
        <div class="date-sub">22.08.2026</div>
    </div>

    <!-- SPIELER EINGABE -->
    <div id="setup-screen" class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>Teilnehmer (8 Spieler)</h2>
        <p style="text-align: center; color: var(--sub); font-size: 0.9em; margin-top: -10px;">Die Gruppen werden beim Starten zufällig ausgelost.</p>
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <input type="text" id="p1" value="Jürgen Schützendorf">
                <input type="text" id="p2" value="Michael Müller">
                <input type="text" id="p3" value="Markus Ginsel">
                <input type="text" id="p4" value="Niklas Weichert">
            </div>
            <div style="flex: 1;">
                <input type="text" id="p5" value="Dominik Helmke">
                <input type="text" id="p6" value="Ludger Schledorn">
                <input type="text" id="p7" value="Andreas Denner">
                <input type="text" id="p8" value="Thomas Kliver">
            </div>
        </div>
        <button class="btn" onclick="startTournament()">🎲 Gruppen auslosen & Turnier Starten</button>
    </div>

    <!-- TURNIER DASHBOARD -->
    <div id="tournament-screen" class="hidden">
        
        <div style="max-width: 1200px; margin: 0 auto 20px auto; display: flex; justify-content: flex-end;">
            <button class="btn btn-danger" style="width: auto; padding: 8px 16px;" onclick="resetTournament()">🔄 Turnier zurücksetzen / Neu auslosen</button>
        </div>

        <!-- GRUPPEN PHASE -->
        <div class="grid">
            <div class="card">
                <h2>Gruppe A - Tabelle</h2>
                <table>
                    <thead><tr><th>Platz</th><th>Name</th><th>S</th><th>N</th><th>Legs</th></tr></thead>
                    <tbody id="table-A"></tbody>
                </table>
                <h3 style="margin-top: 20px;">Spiele</h3>
                <div id="matches-A"></div>
            </div>

            <div class="card">
                <h2>Gruppe B - Tabelle</h2>
                <table>
                    <thead><tr><th>Platz</th><th>Name</th><th>S</th><th>N</th><th>Legs</th></tr></thead>
                    <tbody id="table-B"></tbody>
                </table>
                <h3 style="margin-top: 20px;">Spiele</h3>
                <div id="matches-B"></div>
            </div>
        </div>

        <!-- KO PHASE -->
        <div class="ko-section">
            <div class="card">
                <h2>1. Viertelfinale (Überkreuz)</h2>
                <div id="quarter-finals"></div>
            </div>

            <div class="card">
                <h2>2. Halbfinale</h2>
                <div id="semi-finals"></div>
            </div>

            <div class="card">
                <h2>3. Platzierungsspiele & Finale</h2>
                <div id="finals"></div>
            </div>
        </div>
    </div>

<script>
let players = { A: [], B: [] };
let matches = { A: [], B: [] };

let qf = [
    { p1: '', p2: '', s1: 0, s2: 0, label: 'VF 1 (1.A vs 4.B)' },
    { p1: '', p2: '', s1: 0, s2: 0, label: 'VF 2 (2.A vs 3.B)' },
    { p1: '', p2: '', s1: 0, s2: 0, label: 'VF 3 (3.A vs 2.B)' },
    { p1: '', p2: '', s1: 0, s2: 0, label: 'VF 4 (4.A vs 1.B)' }
];

let sf = [
    { p1: '', p2: '', s1: 0, s2: 0, label: 'HF 1 (Sieger VF 1 vs Sieger VF 3)' },
    { p1: '', p2: '', s1: 0, s2: 0, label: 'HF 2 (Sieger VF 2 vs Sieger VF 4)' }
];

let finalGames = [
    { p1: '', p2: '', s1: 0, s2: 0, label: 'Spiel um Platz 3 (Verlierer HF 1 vs Verlierer HF 2)' },
    { p1: '', p2: '', s1: 0, s2: 0, label: 'FINALE (Sieger HF 1 vs Sieger HF 2)' }
];

window.onload = function() {
    loadState();
};

function saveData() {
    const data = {
        players: players,
        matches: matches,
        qf: qf,
        sf: sf,
        finalGames: finalGames,
        isStarted: true
    };
    localStorage.setItem('dart_tournament_tvk3', JSON.stringify(data));
}

function loadState() {
    const saved = localStorage.getItem('dart_tournament_tvk3');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            if (data && data.isStarted) {
                players = data.players;
                matches = data.matches;
                qf = data.qf;
                sf = data.sf;
                finalGames = data.finalGames;

                renderMatches('A');
                renderMatches('B');
                updateTables();

                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('tournament-screen').classList.remove('hidden');
            }
        } catch (e) {
            console.error("Fehler beim Laden des Speicherstands", e);
        }
    }
}

function resetTournament() {
    if (confirm("Möchtest du das aktuelle Turnier wirklich löschen und neu auslosen?")) {
        localStorage.removeItem('dart_tournament_tvk3');
        location.reload();
    }
}

function startTournament() {
    let allPlayers = [
        document.getElementById('p1').value,
        document.getElementById('p2').value,
        document.getElementById('p3').value,
        document.getElementById('p4').value,
        document.getElementById('p5').value,
        document.getElementById('p6').value,
        document.getElementById('p7').value,
        document.getElementById('p8').value
    ];

    for (let i = allPlayers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allPlayers[i], allPlayers[j]] = [allPlayers[j], allPlayers[i]];
    }

    players.A = allPlayers.slice(0, 4).map(name => ({
        name: name, wins: 0, losses: 0, legsWon: 0, legsLost: 0
    }));
    
    players.B = allPlayers.slice(4, 8).map(name => ({
        name: name, wins: 0, losses: 0, legsWon: 0, legsLost: 0
    }));

    generateGroupMatches('A');
    generateGroupMatches('B');

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('tournament-screen').classList.remove('hidden');

    updateTables();
    saveData();
}

function generateGroupMatches(group) {
    const list = players[group];
    const matchups = [[0, 1], [2, 3], [0, 2], [1, 3], [0, 3], [1, 2]];
    
    matches[group] = matchups.map(pair => ({
        p1: list[pair[0]].name,
        p2: list[pair[1]].name,
        s1: 0, s2: 0,
        played: false
    }));

    renderMatches(group);
}

function renderMatches(group) {
    const container = document.getElementById(`matches-${group}`);
    container.innerHTML = '';
    
    matches[group].forEach((m, idx) => {
        let p1Class = "player";
        let p2Class = "player right";
        
        if (m.played) {
            if (m.s1 > m.s2) { p1Class += " winner"; p2Class += " loser"; }
            else if (m.s2 > m.s1) { p1Class += " loser"; p2Class += " winner"; }
        }

        container.innerHTML += `
            <div class="match-row">
                <span class="${p1Class}">${m.p1}</span>
                <div>
                    <input type="number" min="0" value="${m.s1}" onchange="updateScore('${group}', ${idx}, 1, this.value)">
                    :
                    <input type="number" min="0" value="${m.s2}" onchange="updateScore('${group}', ${idx}, 2, this.value)">
                </div>
                <span class="${p2Class}">${m.p2}</span>
            </div>
        `;
    });
}

function updateScore(group, matchIdx, playerNum, score) {
    const m = matches[group][matchIdx];
    m['s' + playerNum] = parseInt(score) || 0;
    
    m.played = (m.s1 > 0 || m.s2 > 0 || (m.s1 !== 0 && m.s1 === m.s2));
    
    calculateStats(group);
    updateTables();
    renderMatches(group);
    saveData();
}

function calculateStats(group) {
    players[group].forEach(p => { p.wins = 0; p.losses = 0; p.legsWon = 0; p.legsLost = 0; });

    matches[group].forEach(m => {
        const p1 = players[group].find(p => p.name === m.p1);
        const p2 = players[group].find(p => p.name === m.p2);

        p1.legsWon += m.s1; p1.legsLost += m.s2;
        p2.legsWon += m.s2; p2.legsLost += m.s1;

        if (m.played) {
            if (m.s1 > m.s2) { p1.wins++; p2.losses++; }
            else if (m.s2 > m.s1) { p2.wins++; p1.losses++; }
        }
    });

    players[group].sort((a, b) => {
        if (b.wins !== a.wins) return b.wins - a.wins;
        const diffA = a.legsWon - a.legsLost;
        const diffB = b.legsWon - b.legsLost;
        if (diffB !== diffA) return diffB - diffA;
        return b.legsWon - a.legsWon;
    });
}

function updateTables() {
    ['A', 'B'].forEach(group => {
        const tbody = document.getElementById(`table-${group}`);
        tbody.innerHTML = '';
        players[group].forEach((p, i) => {
            const diff = p.legsWon - p.legsLost;
            tbody.innerHTML += `
                <tr>
                    <td><b>${i + 1}.</b></td>
                    <td><span class="table-player-tag">${p.name}</span></td>
                    <td>${p.wins}</td>
                    <td>${p.losses}</td>
                    <td>${p.legsWon}:${p.legsLost} (${diff > 0 ? '+' : ''}${diff})</td>
                </tr>
            `;
        });
    });

    updateKOPairings();
    renderKOPasses();
}

// Prüft ob alle 6 Spiele einer spezifischen Gruppe fertig sind
function isGroupFinished(group) {
    if (!matches[group] || matches[group].length < 6) return false;
    return matches[group].every(m => m.played);
}

function updateKOPairings() {
    const groupADone = isGroupFinished('A');
    const groupBDone = isGroupFinished('B');
    const a = players.A;
    const b = players.B;

    // Spieler aus Gruppe A eintragen sobald Gruppe A fertig ist
    if (groupADone) {
        qf[0].p1 = a[0].name; // 1.A
        qf[1].p1 = a[1].name; // 2.A
        qf[2].p1 = a[2].name; // 3.A
        qf[3].p1 = a[3].name; // 4.A
    } else {
        qf[0].p1 = 'Warten auf Gruppe A...';
        qf[1].p1 = 'Warten auf Gruppe A...';
        qf[2].p1 = 'Warten auf Gruppe A...';
        qf[3].p1 = 'Warten auf Gruppe A...';
    }

    // Spieler aus Gruppe B eintragen sobald Gruppe B fertig ist
    if (groupBDone) {
        qf[0].p2 = b[3].name; // 4.B
        qf[1].p2 = b[2].name; // 3.B
        qf[2].p2 = b[1].name; // 2.B
        qf[3].p2 = b[0].name; // 1.B
    } else {
        qf[0].p2 = 'Warten auf Gruppe B...';
        qf[1].p2 = 'Warten auf Gruppe B...';
        qf[2].p2 = 'Warten auf Gruppe B...';
        qf[3].p2 = 'Warten auf Gruppe B...';
    }

    // Halbfinale und Finale
    sf[0].p1 = getWinner(qf[0]) || 'Sieger VF 1';
    sf[0].p2 = getWinner(qf[2]) || 'Sieger VF 3';
    sf[1].p1 = getWinner(qf[1]) || 'Sieger VF 2';
    sf[1].p2 = getWinner(qf[3]) || 'Sieger VF 4';

    finalGames[0].p1 = getLoser(sf[0]) || 'Verlierer HF 1';
    finalGames[0].p2 = getLoser(sf[1]) || 'Verlierer HF 2';
    finalGames[1].p1 = getWinner(sf[0]) || 'Sieger HF 1';
    finalGames[1].p2 = getWinner(sf[1]) || 'Sieger HF 2';
}

function getWinner(m) {
    if (isReadyForKO(m.p1, m.p2) && (m.s1 > 0 || m.s2 > 0)) {
        if (m.s1 > m.s2) return m.p1;
        if (m.s2 > m.s1) return m.p2;
    }
    return null;
}

function getLoser(m) {
    if (isReadyForKO(m.p1, m.p2) && (m.s1 > 0 || m.s2 > 0)) {
        if (m.s1 > m.s2) return m.p2;
        if (m.s2 > m.s1) return m.p1;
    }
    return null;
}

function isReadyForKO(p1, p2) {
    return !p1.includes('Warten auf') && !p2.includes('Warten auf') && 
           !p1.includes('Sieger') && !p2.includes('Sieger') &&
           !p1.includes('Verlierer') && !p2.includes('Verlierer');
}

function renderKOPasses() {
    renderKORow('quarter-finals', qf, 'updateQFScore');
    renderKORow('semi-finals', sf, 'updateSFScore');
    renderKORow('finals', finalGames, 'updateFinalScore');
}

function renderKORow(containerId, list, changeFn) {
    const c = document.getElementById(containerId);
    c.innerHTML = '';
    list.forEach((m, idx) => {
        let p1Class = "player";
        let p2Class = "player right";
        
        if (!isReadyForKO(m.p1, 'x')) p1Class += " placeholder";
        if (!isReadyForKO('x', m.p2)) p2Class += " placeholder";

        if (m.s1 > 0 || m.s2 > 0) {
            if (m.s1 > m.s2) { p1Class += " winner"; p2Class += " loser"; }
            else if (m.s2 > m.s1) { p1Class += " loser"; p2Class += " winner"; }
        }

        const disabledAttr = (!isReadyForKO(m.p1, m.p2)) ? 'disabled' : '';

        c.innerHTML += `
            <div style="margin-bottom: 12px;">
                <div style="font-size: 0.85em; color: var(--sub); margin-bottom: 4px;">${m.label}</div>
                <div class="match-row">
                    <span class="${p1Class}">${m.p1}</span>
                    <div>
                        <input type="number" min="0" value="${m.s1}" ${disabledAttr} onchange="${changeFn}(${idx}, 1, this.value)">
                        :
                        <input type="number" min="0" value="${m.s2}" ${disabledAttr} onchange="${changeFn}(${idx}, 2, this.value)">
                    </div>
                    <span class="${p2Class}">${m.p2}</span>
                </div>
            </div>
        `;
    });
}

function updateQFScore(idx, playerNum, score) {
    qf[idx]['s' + playerNum] = parseInt(score) || 0;
    updateTables();
    saveData();
}

function updateSFScore(idx, playerNum, score) {
    sf[idx]['s' + playerNum] = parseInt(score) || 0;
    updateTables();
    saveData();
}

function updateFinalScore(idx, playerNum, score) {
    finalGames[idx]['s' + playerNum] = parseInt(score) || 0;
    renderKOPasses();
    saveData();
}
</script>
</body>
</html>
